<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>FASHION OKAN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{../css/bottom-menu.css}">
    <script th:src="@{/js/bottom-menu.js}" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- 共通ヘッダーの読み込み -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-fill">
        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <!-- <p th:text="${message}">message</p> -->
                <h2 class="mb-0">アイテム新規登録</h2>
            </div>

            <!-- エラーが発生した場合、エラーメッセージを表示 -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>

            <!-- アイテム一覧へ戻る -->
            <div th:replace="~{fragments/btn :: to-all-items}"></div>
        </div>
    </main>

    <!-- メニューの読み込み -->
    <div th:replace="~{fragments/bottom-menu :: bottom-menu}"></div>

    <!-- 共通フッターの読み込み -->
    <!-- <div th:replace="~{fragments/footer :: footer}"></div> -->
</body>

</html>
