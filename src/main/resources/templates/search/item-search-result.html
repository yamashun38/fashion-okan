<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHION OKAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{../css/style.css}">
    <link rel="stylesheet" th:href="@{../css/bottom-menu.css}">
    <script th:src="@{/js/bottom-menu.js}" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- 共通ヘッダーの読み込み -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-fill">
        <div class="container mt-4">

            <!-- タイトル -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">検索結果一覧</h2>
            </div>

            <!-- 検索条件変更 -->
            <a th:href="@{/item-search(
                itemName=${searchItemDto.itemName},
                startDate=${searchItemDto.startDate},
                endDate=${searchItemDto.endDate},
                description=${searchItemDto.description},
                favorite=${searchItemDto.favorite},
                selectedTagIds=${#strings.arrayJoin(searchItemDto.selectedTagIds, ',')}
            )}" class="btn btn-outline-secondary btn-sm mb-3">検索条件変更</a>

            <!-- 検索結果一覧表示 -->
            <div class="row row-cols-3 row-cols-md-4 row-cols-lg-5 g-3">
                <div class="col" th:each="item : ${searchItemsResults}">
                    <a th:href="@{/item-detail/{id}(id=${item.itemId})}">
                        <img th:src="${item.s3Url}" alt="アイテム画像" class="img-fluid rounded shadow-sm">
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- メニューの読み込み -->
    <div th:replace="~{fragments/bottom-menu :: bottom-menu}"></div>
</body>

</html>
