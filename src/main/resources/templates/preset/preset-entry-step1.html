<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHION OKAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{../css/style.css}">
    <link rel="stylesheet" th:href="@{../css/bottom-menu.css}">
    <script th:src="@{/js/bottom-menu.js}" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- 共通ヘッダーの読み込み -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-fill">
        <div class="container mt-4">

            <!-- タイトル -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">プリセット登録</h2>
            </div>

            <!-- エラーが発生した場合、エラーメッセージを表示 -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>

            <!-- 登録フォーム -->
            <div class="row">
                <div class="col-12 col-md-8 col-lg-6">
                    <form th:action="@{/item-entry}" th:object="${itemDto}" method="post" enctype="multipart/form-data">

                        <!-- プリセット名 -->
                        <div class="mb-3">
                            <label for="itemName" class="form-label fw-bold">名前</label>
                            <input type="text" class="form-control" id="itemName" th:field="*{itemName}">
                            <div class="text-danger mt-2" th:if="${#fields.hasErrors('itemName')}"
                                th:errors="*{itemName}"></div>
                        </div>

                        <!-- タグ -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">タグ</label>
                            <div class="d-flex flex-wrap" id="tagList">
                                <th:block th:each="tag : ${allTags}">
                                    <button type="button" class="btn btn-outline-secondary m-1 tag-button"
                                        th:data-id="${tag.tagId}" th:text="${tag.tagName}"></button>
                                </th:block>
                            </div>
                            <!-- 選択されたタグIDたちを送信するためのhidden -->
                            <input type="hidden" name="selectedTagIds" id="selectedTagIds">
                        </div>

                        <!-- 説明 -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">説明</label>
                            <input type="textarea" class="form-control" id="description" th:field="*{description}">
                            <div class="text-danger mt-2" th:if="${#fields.hasErrors('description')}"
                                th:errors="*{description}"></div>
                        </div>

                        <!-- 登録 -->
                        <div class="d-grid gap-2 mt-5">
                            <button type="submit" class="btn btn-primary">登録</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- メニューの読み込み -->
    <div th:replace="~{fragments/bottom-menu :: bottom-menu}"></div>
</body>

</html>
